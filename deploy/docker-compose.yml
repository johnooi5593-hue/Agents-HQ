# Agents HQ on your own server (any VPS with Docker). Copy .env.example to .env, fill it in, then:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Caddy gets an HTTPS certificate for HQ_DOMAIN by itself; point the domain's DNS at the server first.
services:
  hq:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      HQ_PASSWORD: ${HQ_PASSWORD:?set HQ_PASSWORD in deploy/.env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in deploy/.env}
      HQ_SECRET: ${HQ_SECRET:-}
      HQ_SECURE: "1"
      HQ_TRUST_PROXY: "1"
    volumes:
      - hq-data:/data
    expose:
      - "7331"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HQ_DOMAIN: ${HQ_DOMAIN:?set HQ_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  hq-data:
  caddy-data:
