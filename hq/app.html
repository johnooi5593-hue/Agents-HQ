<title>Agents HQ</title>
<meta name="description" content="Agents HQ: an office of AI agents in eight teams around one shared brain.">
<link rel="stylesheet" href="/hud.css">
</head>
<body>
<!-- the 3D office (hq/office3d.js) fills the window. "view active" keeps the first-version scene drawing as well. -->
<div id="office3d" class="view active"></div>

<!-- every HTML overlay lives in #hud (hq/hud.js). Pointer events are off except on interactive elements. -->
<div id="hud">
  <header id="topbar">
    <div class="tb-left">
      <a id="brand" href="/" title="Agents HQ"><span class="logo"></span><span class="wordmark">Agents HQ</span></a>
      <div id="user-menu" class="user-menu ia">
        <button class="user-btn" id="user-btn" type="button" aria-haspopup="menu"><span class="user-avatar" id="user-initial">O</span><span id="user-name">Owner</span><span class="chev">▾</span></button>
        <div class="menu" id="user-dropdown" hidden>
          <div class="menu-hint">Office folder<code id="office-path">the folder you started Agents HQ from · inbox/ · out/ · approved/</code></div>
          <button class="menu-item" id="menu-overview" type="button">Back to the overview</button>
          <button class="menu-item" id="menu-lead" type="button">Open the lead log</button>
          <form method="post" action="/logout" id="logout-form" hidden><button class="menu-item" type="submit">Log out</button></form>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button class="tab active" id="tab-office" data-view="office" type="button"><svg class="i tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="tl">Office</span></button>
      <button class="tab" id="tab-tasks" data-view="tasks" type="button"><svg class="i tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg><span class="tl">Tasks</span> <span class="badge zero" id="tasks-badge">0</span></button>
      <button class="tab" id="tab-calendar" data-view="calendar" type="button"><svg class="i tab-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="tl">Calendar</span></button>
      <button class="tab" id="tab-brain" data-view="brain" type="button"><svg class="i tab-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/></svg><span class="tl">Brain</span></button>
      <button class="tab tab-lead" id="tab-lead" data-view="lead" type="button" aria-label="Lead log and messages"><svg class="i tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12Z"/></svg><span class="tl">Lead</span><i class="dot lead-dot"></i></button>
    </nav>
    <div class="tb-right">
      <button id="ask-open" class="tb-ico" type="button" title="Ask any agent" aria-label="Ask any agent"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <form id="ask-any" class="ask ia" autocomplete="off">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="who" id="ask-who"></span>
        <input id="ask-input" type="text" placeholder="Ask any agent…" aria-label="Ask any agent" enterkeyhint="send">
        <button class="mic" id="ask-mic" type="button" title="Talk to the office" data-voice><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <kbd id="ask-kbd">⌘K</kbd>
        <button class="ask-send" id="ask-send" type="submit" title="Send" aria-label="Send"><svg class="i" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
        <button class="xbtn ask-x" id="ask-close" type="button" title="Close" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <div class="ask-menu" id="ask-menu" hidden></div>
      </form>
      <div id="agents-pill" class="agents-pill"><i class="dot"></i><span id="agents-pill-text">… agents</span></div>
      <button id="bell" class="bell" type="button" title="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="bell-badge" id="bell-badge" hidden></span></button>
      <div id="avatar" class="avatar ia" title="You">O</div>
    </div>
  </header>

  <!-- 3D-anchored billboards: team cards above the rooms, name pills above the characters, the Brain label -->
  <div id="team-cards"></div>
  <div id="agent-pills"></div>
  <div id="brain-label" class="brain-label ia" title="Open the Brain"><span class="t1">The Brain</span><span class="t2"><b id="brain-notes">…</b> notes · shared memory</span></div>

  <!-- screen-fixed chrome -->
  <div id="toasts" aria-live="polite"></div>
  <div id="notif-list" hidden></div>
  <div id="panel-dim"></div>
  <aside id="team-panel" class="panel" hidden></aside>
  <aside id="task-board" class="panel" hidden></aside>
  <aside id="calendar" class="panel" hidden></aside>
  <aside id="brain-view" class="panel" hidden></aside>
  <div id="agent-card" hidden></div>
  <div id="subagent-cards"></div>
  <div id="room-label" hidden></div>
  <div id="status-chips">
    <span class="lbl">Runs on</span>
    <span class="chip" data-model="opus">Opus</span>
    <span class="chip" data-model="sonnet">Sonnet</span>
    <span class="chip" data-model="haiku">Haiku</span>
    <span class="chip" data-model="cloud">headless · cloud</span>
  </div>
  <div id="minimap">
    <div class="hd"><span>MAP</span><span id="minimap-zoom">100%</span></div>
    <canvas id="minimap-canvas" width="264" height="156"></canvas>
    <div class="ft">
      <button id="minimap-out" type="button" title="Zoom out">−</button>
      <button id="minimap-in" type="button" title="Zoom in">+</button>
      <button id="minimap-full" type="button" title="Fit the whole office">⤢</button>
    </div>
  </div>

  <!-- the lead's log drawer (collapsed console) -->
  <div id="lead-log">
    <div class="bar" id="lead-bar"><i class="dot"></i><span class="lt" id="lead-text">Lead · idle</span><span class="car">▴</span><button class="xbtn lead-x" id="lead-close" type="button" title="Close" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="con" id="lead-con"><div class="ev system">waiting for the first message</div></div>
    <form id="lead-form"><input id="lead-input" type="text" placeholder="Tell the lead anything, for example: OK, or: make the hook shorter" autocomplete="off" enterkeyhint="send"><button type="submit">Send</button></form>
  </div>

  <!-- voice: a small orb button when idle, the full listening overlay when open -->
  <div id="voice-orb" class="mini ia" role="button" tabindex="0" title="Talk to the office">
    <div class="ghost g1"></div><div class="ghost g2"></div><div class="ghost g3"></div>
    <button class="xbtn vx" id="voice-close" type="button" title="Close" aria-label="Close">×</button>
    <div class="stage">
      <div class="orb" id="orb"></div>
      <div class="cap" id="voice-cap">Listening</div>
      <div class="hint" id="voice-hint"></div>
    </div>
    <div id="voice-bar">
      <div class="tbox" id="voice-tbox"><span class="wave" id="voice-wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><textarea id="voice-text" rows="2" placeholder="Listening…" enterkeyhint="send"></textarea></div>
      <button class="vbtn mic" id="voice-mic" type="button" title="Microphone"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="vbtn send" id="voice-send" type="button" title="Send"><svg class="i" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
    </div>
  </div>

  <input type="file" id="picker" multiple hidden>
</div>

<script src="/vendor/three.min.js"></script>
<script src="/vendor/three-examples/CopyShader.js"></script>
<script src="/vendor/three-examples/LuminosityHighPassShader.js"></script>
<script src="/vendor/three-examples/EffectComposer.js"></script>
<script src="/vendor/three-examples/RenderPass.js"></script>
<script src="/vendor/three-examples/ShaderPass.js"></script>
<script src="/vendor/three-examples/UnrealBloomPass.js"></script>
<script src="/vendor/three-examples/RoundedBoxGeometry.js"></script>
<script src="/vendor/three-examples/CSS2DRenderer.js"></script>
<script src="/vendor/three-examples/OrbitControls.js"></script>
<script src="/hud.js"></script>
<script src="/office3d.js"></script>
</body>
</html>
