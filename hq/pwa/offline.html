<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161922">
<title>Agents HQ</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e8e8ea;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 26em; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 21px; margin: 18px 0 6px; }
  p { color: #a3a9b6; margin: 0 0 18px; }
  ul { text-align: left; color: #c6cbd5; padding-left: 1.2em; margin: 0 0 22px; }
  li { margin: 6px 0; }
  button { font: 600 16px system-ui, sans-serif; color: #fff; background: #3b6fe0; border: 0; border-radius: 12px; padding: 12px 22px; }
  small { display: block; margin-top: 14px; color: #6f7684; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Can't reach your PC</h1>
  <p>Agents HQ runs on your computer, and your phone can't get to it right now.</p>
  <ul>
    <li>Is the PC on and awake?</li>
    <li>Is Agents HQ open on it (the tray icon)?</li>
    <li>Is Tailscale on, on this phone?</li>
  </ul>
  <button type="button" onclick="location.replace('/')">Try again</button>
  <small id="auto">Trying again by itself every 10 seconds…</small>
</main>
<script>
  // HQ may just be restarting into an update: come back as soon as it answers
  setInterval(function () {
    fetch("/manifest.webmanifest", { cache: "no-store" }).then(function (r) { if (r.ok) location.replace("/"); }).catch(function () {});
  }, 10000);
</script>
</body>
</html>
